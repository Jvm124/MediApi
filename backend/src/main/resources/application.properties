spring.application.name=backend

# Lee las credenciales locales de backend/.env, si existe (ver docs/adr/0003).
# Si una variable también existe como variable de entorno, gana la variable de entorno.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost/vollmed_api
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
#spring.web.error.include-binding-errors=never

api.security.token.secret = ${JWT_SECRET}

# Administrador inicial: se crea al arrancar solo si no existe ningún ADMINISTRADOR (ver docs/adr/0002)
api.admin.correo=${ADMIN_EMAIL:}
api.admin.contrasenia=${ADMIN_PASSWORD:}