# Dependabot revisa cada semana si hay versiones nuevas de las dependencias y abre un PR para
# actualizarlas (SEC-06). Las versiones menores y los parches de cada carpeta llegan juntos en
# un solo PR; las versiones mayores llegan en PRs aparte, porque pueden romper cosas.
# Solo funciona desde la rama principal (main).
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      menores-y-parches:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      menores-y-parches:
        update-types: ["minor", "patch"]
    ignore:
      # El proyecto usa Node.js 24: sus tipos se quedan en la 24 (sí llegan menores y parches).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Tailwind 4 necesita una migración aparte (ver el seguimiento de la revisión).
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  # Las acciones del CI (.github/workflows/ci.yml): propone un PR cuando sale una versión
  # mayor nueva, por ejemplo actions/checkout@v8.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
